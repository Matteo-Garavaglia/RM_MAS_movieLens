[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-rag"
version = "0.4.0"
description = "Versioned Movie RAG retrieval, MCP tools and provider-neutral LLM orchestration"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "pydantic>=2.12,<3",
    "qdrant-client==1.19.0",
]

[project.optional-dependencies]
bge = ["FlagEmbedding==1.4.2"]
experiments = ["FlagEmbedding==1.4.2", "rank-bm25>=0.2.2,<1", "sentence-transformers>=5.4,<6", "transformers>=4.51,<5"]
mcp = ["mcp>=2,<3"]
llm-gemini = ["google-genai>=1.75,<2", "python-dotenv>=1,<2"]
llm-openai = ["openai>=2.54,<3", "python-dotenv>=1,<2"]
llm = ["google-genai>=1.75,<2", "openai>=2.54,<3", "python-dotenv>=1,<2"]
test = ["pytest>=8,<10", "anyio>=4.9,<5"]

[project.scripts]
movie-rag-mcp = "movie_rag.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
movie_rag = ["prompts/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
